name: update-data

on:
  schedule:
    - cron: "30 9 * * *"   # 毎日 18:30 JST（JPX の翌営業日分更新 17:00頃 の後）
    - cron: "0 22 * * *"   # 毎日 07:00 JST（前夜の米国指標・決算の反応を取り込む）
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # 生成データを commit して履歴を蓄積するため
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch earnings times (TDnet)
        continue-on-error: true   # 失敗時は時刻なしで表示
        run: python scripts/fetch_tdnet.py

      - name: Fetch IPO
        continue-on-error: true
        run: python scripts/fetch_ipo.py

      - name: Fetch Nikkei 225 constituents
        continue-on-error: true   # 失敗時は前回の一覧のまま
        run: python scripts/fetch_n225.py

      - name: Fetch market snapshot
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: Flash news (速報・連想)
        continue-on-error: true   # PC の見張り役が止まっている間の分。トークン未設定ならスキップ
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN が未設定のためスキップ"; exit 0; fi
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          python scripts/flash/flash_watch.py --ci

      - name: Fetch market reactions
        continue-on-error: true   # Yahoo 側の不調で全体を止めない
        run: python scripts/fetch_reactions.py

      - name: Build bias list
        continue-on-error: true
        run: python scripts/build_bias.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/earnings_backfill.json data/tdnet.json
          git add data/flash_liq.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Tokyo date +%F)"
          # Claude の定期実行が同時に push している場合に備えて rebase してから push
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
