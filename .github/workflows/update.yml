name: update-data

on:
  schedule:
    - cron: "30 9 * * *"   # 毎日 18:30 JST（JPX の翌営業日分更新 17:00頃 の後）
    - cron: "0 22 * * *"   # 毎日 07:00 JST（前夜の米国指標・決算の反応を取り込む）
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # 生成データを commit して履歴を蓄積するため
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch market reactions
        continue-on-error: true   # Yahoo 側の不調で全体を止めない
        run: python scripts/fetch_reactions.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Tokyo date +%F)"
          # Claude の定期実行が同時に push している場合に備えて rebase してから push
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
