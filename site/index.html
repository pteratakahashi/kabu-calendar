<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="株カレンダー">
<meta name="robots" content="noindex">
<title>株イベントカレンダー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 id="page-title">ホーム</h1>
  <div id="updated" class="updated">読み込み中…</div>
</header>

<main>
  <!-- ホーム（朝・夕のブリーフ＋保有株） -->
  <section id="view-home" class="view active">
    <div id="home"></div>
  </section>

  <!-- 予定タブの切り替え（イベント / 決算 / IPO） -->
  <div class="seg plan-seg" id="plan-seg" role="group" aria-label="予定の種類" hidden>
    <button data-v="events" class="on">イベント</button>
    <button data-v="cal">決算</button>
    <button data-v="ipo">IPO</button>
    <button data-v="bias">傾向</button>
  </div>

  <!-- イベント（週表示） -->
  <section id="view-events" class="view">
    <div class="month-nav">
      <h2 id="week-label"></h2>
      <label class="datejump" aria-label="日付を選んで移動">📆<input type="date" id="ev-date"></label>
      <button id="wprev" aria-label="前へ">‹</button>
      <button id="wnext" aria-label="次へ">›</button>
      <button id="thisweek" class="chip">今日</button>
    </div>
    <div class="seg" id="ev-mode" role="group" aria-label="表示">
      <button data-v="week" class="on">週</button>
      <button data-v="month">月</button>
    </div>
    <div class="theme-bar" id="ev-themes"></div>
    <div id="week"></div>
  </section>

  <!-- 予定外ニュース -->
  <section id="view-news" class="view">
    <p class="msum news-lead">株価を動かした予定外のニュースと、その後の値動き（反応日・1週間後・1か月後）</p>
    <div class="theme-bar" id="news-cats"></div>
    <div id="news-sum"></div>
    <div id="news-list"></div>
    <p class="note">騰落率は反応日の前日終値＝0%（日本株は日本時間で次に開く立会日、米国株は米国の次の取引日）。データ: Yahoo Finance</p>
  </section>

  <!-- 決算カレンダー -->
  <section id="view-cal" class="view">
    <div class="month-nav">
      <h2 id="month-label"></h2>
      <button id="prev" aria-label="前の月">‹</button>
      <button id="next" aria-label="次の月">›</button>
      <button id="today-btn" class="chip">今日</button>
    </div>
    <div class="seg" id="cal-mode" role="group" aria-label="表示">
      <button data-v="day" class="on">カレンダー</button>
      <button data-v="month">月間まとめ</button>
    </div>
    <div class="cal-cols"><div class="cal-left">
    <div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div id="grid" class="grid"></div>
    <div class="legend">
      <span><i class="dot big"></i>大型決算</span>
      <span><i class="dot watch"></i>保有</span>
      <span><i class="num-sample">12</i>決算社数</span>
    </div>
    </div><div class="cal-right">
    <div class="day-head"><h3 id="day-label"></h3></div>
    <div class="sortbar">
      <label>並び順
        <select id="cal-sort">
          <option value="imp">影響度順</option>
          <option value="w">規模順（時価総額）</option>
          <option value="c">コード順</option>
        </select>
      </label>
    </div>
    <div class="theme-bar" id="cal-themes"></div>
    <ul id="day-list" class="list"></ul>
    <div id="month-list"></div>
    </div></div>
  </section>

  <!-- IPO -->
  <section id="view-ipo" class="view">
    <div class="seg" id="ipo-mode" role="group" aria-label="IPO表示">
      <button data-v="up" class="on">これから</button>
      <button data-v="past">上場済み（今年）</button>
    </div>
    <div id="ipo-list"></div>
    <p class="note">出典: JPX 新規上場会社情報。初値・騰落率は公開価格比（データ: Yahoo Finance）</p>
  </section>

  <!-- 傾向（日経225 × 今後の予定で、過去の反応が上昇・下落に偏っている銘柄） -->
  <section id="view-bias" class="view">
    <div class="seg" id="bias-dir" role="group" aria-label="上昇・下落">
      <button data-v="" class="on">すべて</button>
      <button data-v="1">上がりやすい</button>
      <button data-v="-1">下がりやすい</button>
    </div>
    <div class="seg" id="bias-kind" role="group" aria-label="予定の種類">
      <button data-v="" class="on">すべて</button>
      <button data-v="earn">自社の決算</button>
      <button data-v="ev">指標・海外決算</button>
    </div>
    <div id="bias-list"></div>
    <p class="note" id="bias-note"></p>
  </section>

  <!-- 検索 -->
  <section id="view-search" class="view">
    <input id="q" type="search" inputmode="search" placeholder="銘柄コード・社名で検索（例: 6323, ローツェ）" autocomplete="off">
    <h3 class="sec-h">テーマから探す</h3>
    <div class="theme-grid" id="theme-grid"></div>
    <ul id="search-list" class="list"></ul>
  </section>

  <!-- ウォッチ -->
  <section id="view-hold" class="view">
    <div class="hold-bar"><button id="hold-edit" class="chip">＋ 銘柄を選ぶ</button></div>
    <div id="pf-sum"></div>
    <div id="hold-alert"></div>
    <div id="hold-list"></div>
    <p class="note" id="hold-note"></p>
  </section>
</main>

<dialog id="sheet">
  <div class="sheet-head">
    <h3 id="sheet-title"></h3>
    <button id="sheet-close" aria-label="閉じる">✕</button>
  </div>
  <div id="sheet-body"></div>
</dialog>

<nav class="tabs">
  <button data-v="home" class="on"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-5.5h3V20h5V9.5"/></svg>ホーム</button>
  <button data-v="plan"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16V20H4zM4 10.5h16M8.5 3.5v5M15.5 3.5v5"/></svg>予定</button>
  <button data-v="news"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11v15H6.5A1.5 1.5 0 0 1 5 18zM16 8.5h3v9.5a1.5 1.5 0 0 1-3 0M8 8.5h5M8 12h5M8 15.5h3"/></svg>ニュース</button>
  <button data-v="hold"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8h17v11.5h-17zM9 8V5.5h6V8M3.5 13h17"/></svg>保有</button>
  <button data-v="search"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.5 15.5 20.5 20.5"/></svg>検索</button>
</nav>

<script>
// 古い版（v1〜v3: キャッシュ優先）が残っていたら掃除して読み込み直す
(async () => {
  try {
    const keys = await caches.keys();
    if (keys.some((k) => /^kabucal-v[1-3]$/.test(k))) {
      await Promise.all(keys.map((k) => caches.delete(k)));
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
      location.reload();
    }
  } catch { /* noop */ }
})();
</script>
<script src="app.js"></script>
</body>
</html>
